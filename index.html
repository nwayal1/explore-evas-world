<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Explore World – Kids</title>
<style>
:root{--bg:#fff7d6;--bg2:#d9f3ff;--card:#fff;--ink:#2b2350;--mute:#6a5f94;--p:#7c4dff;--o:#ff7a2f;--g:#22c55e;--pk:#ff4f9a;--b:#1e9bff;--line:#2b2350;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241a4d;--bg2:#12304d;--card:#33286b;--ink:#fff7d6;--mute:#c9bff5;--line:#fff7d6}}
:root[data-theme="dark"]{--bg:#241a4d;--bg2:#12304d;--card:#33286b;--ink:#fff7d6;--mute:#c9bff5;--line:#fff7d6}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,var(--bg),var(--bg2));background-attachment:fixed;color:var(--ink);font-family:"Comic Sans MS","Chalkboard SE","Comic Neue","Trebuchet MS",sans-serif;min-height:100vh}
.view{display:none;max-width:1250px;margin:0 auto;padding:20px 16px 50px}
.view.on{display:block}
h1,h2{margin:0}
.hero{text-align:center;padding:26px 0 4px}
.globe{font-size:84px;display:inline-block;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(8deg)}}
h1{font-size:clamp(40px,9vw,84px);color:var(--p);text-shadow:3px 3px 0 var(--o)}
h2{font-size:clamp(28px,5vw,46px);color:var(--p)}
.sub{font-size:20px;color:var(--mute);margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;margin-top:20px}
.tile{border:4px solid var(--line);border-radius:28px;padding:22px;cursor:pointer;font:inherit;font-size:24px;font-weight:700;color:#fff;text-align:center;box-shadow:0 7px 0 var(--line);transition:transform .15s}
.tile:hover{transform:translateY(-5px) rotate(-1deg)}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.tile .e{font-size:64px;display:block;margin-bottom:6px}
.tile small{display:block;font-weight:400;font-size:15px;margin-top:6px}
.tile:nth-child(6n+1){background:var(--p)}.tile:nth-child(6n+2){background:var(--o)}.tile:nth-child(6n+3){background:var(--g)}.tile:nth-child(6n+4){background:var(--pk)}.tile:nth-child(6n+5){background:var(--b)}.tile:nth-child(6n){background:#f5a400}
.home3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr));max-width:980px;margin:24px auto 0}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.back,select,input{font:inherit;font-size:17px;border:3px solid var(--line);border-radius:22px;padding:8px 16px;background:var(--card);color:var(--ink);cursor:pointer}
.wrap{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
.wrap.in{grid-template-columns:240px 1fr 1fr}
.side{background:var(--card);border:4px solid var(--line);border-radius:24px;padding:10px;max-height:calc(100vh - 110px);overflow:auto;position:sticky;top:10px}
.side input{width:100%;margin-bottom:8px;cursor:text}
.it{display:flex;gap:10px;align-items:center;width:100%;font:inherit;font-size:17px;background:none;border:0;border-radius:14px;padding:8px 10px;color:var(--ink);cursor:pointer;text-align:left}
.it:hover{background:var(--bg)}
.it.on{background:var(--o);color:#fff;font-weight:700}
.it .f{font-size:28px}
.main,.mapbox{background:var(--card);border:4px solid var(--line);border-radius:30px;padding:22px 14px;text-align:center;min-height:440px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 8px 0 var(--line)}
.main{cursor:pointer}
.big{font-size:clamp(110px,22vw,240px);line-height:1.05;animation:pop .4s}
@keyframes pop{from{transform:scale(.5) rotate(-10deg);opacity:0}}
.nm{font-size:clamp(34px,6vw,70px);font-weight:800;margin:0;color:var(--p)}
.lbl{color:var(--mute);font-size:18px;margin-top:10px}
.cap{font-size:clamp(30px,5.5vw,58px);font-weight:800;color:var(--o);margin:0}
.rom{font-size:26px;color:var(--b);margin:0;font-weight:700}
.mean{font-size:20px;color:var(--mute);margin:4px 0 0}
.hint{margin-top:8px;color:var(--mute);font-size:12px;opacity:.7}
.spk{background:var(--g);color:#fff;border:3px solid var(--line);border-radius:30px;font:inherit;font-size:22px;font-weight:700;padding:8px 22px;cursor:pointer;margin-top:8px}
.note{color:var(--mute);font-size:20px;max-width:460px}
.btn{font:inherit;background:var(--o);color:#fff;border:3px solid var(--line);border-radius:30px;padding:12px 24px;font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 5px 0 var(--line)}
.btn.o{background:var(--p)}
.ctl{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:18px}
.fcard{max-width:700px;margin:14px auto 0;min-height:420px}
.word{font-size:clamp(64px,17vw,170px);font-weight:800;color:var(--p);line-height:1.15;word-break:break-word;margin:0;animation:pop .35s}
.prog{max-width:560px;margin:8px auto;height:14px;background:var(--card);border:3px solid var(--line);border-radius:10px;overflow:hidden}
.prog div{height:100%;background:var(--g);transition:width .3s}
#jump{width:90px;cursor:text}
svg{width:100%;max-width:420px;height:auto}
.land{fill:#9be28c;stroke:#2b2350;stroke-width:3;stroke-linejoin:round}
.dot{fill:#7c4dff;opacity:.45}
.pin{fill:#ff4f9a;stroke:#fff;stroke-width:3}
.pulse{fill:#ff4f9a;opacity:.4;animation:pl 1.2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{to{transform:scale(2.6);opacity:0}}
#flash{padding-top:8px}
#flash h2{font-size:14px!important;margin:0}
#flash .sub{font-size:12px!important;margin:2px 0}
#flash .prog{height:6px;border-width:2px;margin:4px auto;max-width:100%}
#flash .back,#flash .btn,#flash input{font-size:12px;padding:4px 10px;border-width:2px;box-shadow:none}
#flash .bar{margin-bottom:2px}
#flash .ctl{margin-top:6px;font-size:12px}
#flash .spk{font-size:13px;padding:4px 12px;border-width:2px;margin-top:4px}
#flash .hint{font-size:10px}
#flash #jump{width:60px}
#flash .fcard{max-width:100%;min-height:calc(100vh - 170px);border-radius:20px;padding:10px;margin-top:6px}
@media(max-width:900px){.wrap,.wrap.in{grid-template-columns:1fr}.side{position:static;max-height:230px}}
</style>
</head>
<body>
<section id="home" class="view on">
  <div class="hero"><div class="globe">🌍</div><h1>Explore World</h1><p class="sub">Hello, little explorer! What do you want to do today? 🎈</p></div>
  <div class="grid home3">
    <button class="tile" onclick="show('conts')"><span class="e">🌐</span>Explore World<small>Flags and capitals</small></button>
    <button class="tile" onclick="show('langs')"><span class="e">🃏</span>Flash Cards<small>Learn new words and listen</small></button>
    <button class="tile" onclick="openIndia()"><span class="e">🗺️</span>Explore India<small>States, capitals and map</small></button>
  </div>
</section>

<section id="conts" class="view">
  <div class="bar"><button class="back" onclick="show('home')">⬅ Home</button></div>
  <h2>Pick a Continent 🌎</h2>
  <div class="grid" id="contGrid"></div>
</section>

<section id="langs" class="view">
  <div class="bar"><button class="back" onclick="show('home')">⬅ Home</button></div>
  <h2>Pick a Language 🃏</h2>
  <div class="grid" id="langGrid"></div>
</section>

<section id="browse" class="view">
  <div class="bar">
    <button class="back" onclick="show(backTo)">⬅ Back</button>
    <button class="back" onclick="show('home')">🏠 Home</button>
    <select id="sw" onchange="openC(this.value)"></select>
    <h2 id="bt"></h2>
  </div>
  <div class="wrap" id="wrap">
    <div class="side"><input id="q" placeholder="🔍 Search…" oninput="renderSide()"><div id="sideList"></div></div>
    <div class="main" id="main" onclick="nextItem()"></div>
    <div class="mapbox" id="mapbox" style="display:none"></div>
  </div>
</section>

<section id="flash" class="view">
  <div class="bar"><button class="back" onclick="show('langs')">⬅ Languages</button><button class="back" onclick="show('home')">🏠 Home</button></div>
  <h2 id="ft" style="text-align:center"></h2>
  <p class="sub" id="fcnt" style="text-align:center"></p>
  <div class="prog"><div id="pb"></div></div>
  <div class="main fcard" id="fc" onclick="stepF(1)"></div>
  <div class="ctl"><button class="btn o" onclick="stepF(-1)">⬅ Back</button><button class="btn" onclick="stepF(1)">Next ➡</button></div>
  <div class="ctl"><span>Go to word #</span><input id="jump" type="number" min="1" onchange="jumpF(this.value)"></div>
</section>

    $('mapbox').innerHTML=`<div class="lbl" style="margin:0 0 6px">📍 Where is ${x[1]}?</div><svg viewBox="0 0 620 640"><polygon class="land" points="${OUT.map(o=>PX(o[0],o[1]).join(',')).join(' ')}"/>${d}<circle class="pulse" cx="${px}" cy="${py}" r="12"/><circle class="pin" cx="${px}" cy="${py}" r="13"/><text x="${Math.min(+px+18,470)}" y="${+py+6}" font-size="26" font-weight="700" fill="#2b2350" stroke="#fff" stroke-width="5" paint-order="stroke">${x[2].split(' /')[0]}</text></svg>`;
  }
}

function wordsFor(k){
  let a;
